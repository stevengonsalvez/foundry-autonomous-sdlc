# Control center: the static app from apps/control-center (mounted read-only), plus the ledger's two
# read-only documents proxied same-origin from ledger-api. POST /ingest is NOT proxied: the control center
# is read only, and the ledger's write door stays on the private `ledger` network.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;   # Location: /?data=... (path only), so any host port mapping keeps working

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving per request (proxy_pass with a variable) lets nginx start before
    # ledger-api and survive its restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ledger_api http://ledger-api:8080;

    # index.html carries a CSP meta tag with connect-src 'self', so same-origin fetches of /state.json
    # and /issues.json are allowed. These headers add what a meta tag cannot (frame-ancestors).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The app reads the ledger only when ?data= names it; a bare visit gets the compose data sources.
    location = / {
        if ($args = "") {
            return 302 /?data=state.json&issues=issues.json;
        }
        try_files /index.html =404;
    }

    location = /state.json {
        limit_except GET { deny all; }
        proxy_pass $ledger_api;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /issues.json {
        limit_except GET { deny all; }
        proxy_pass $ledger_api;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Dotfiles (none expected in the app tree) are never served.
    location ~ /\. {
        return 404;
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
}
