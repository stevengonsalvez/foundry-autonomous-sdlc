# Allow-list forward proxy for the coder. The coder sits on an internal network with no route out; this
# proxy is its only way to the internet. Policy: HTTPS CONNECT to port 443 of a listed host, nothing else.
# No TLS interception: clients see the real certificates, the proxy sees only host names.

http_port 3128

acl CONNECT method CONNECT
acl https_port port 443
# -n: match the literal requested name, no reverse DNS, so a bare IP never matches a listed host.
acl allowed_hosts dstdomain -n "/etc/squid/allowlist.txt"

http_access deny !CONNECT
http_access deny !https_port
http_access allow allowed_hosts
http_access deny all

# Forward proxy only: no cache, no peers, no ICP.
cache deny all
cache_mem 8 MB
icp_port 0
htcp_port 0
forwarded_for delete

access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
pid_filename /run/squid/squid.pid
coredump_dir /tmp
shutdown_lifetime 1 seconds
