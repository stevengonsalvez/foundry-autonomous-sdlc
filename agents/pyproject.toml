[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdlc-agents"
version = "0.1.0"
description = "SDLC Foundry prompt agents CLI"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-projects>=2.3.0",
    "azure-identity",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sdlc_agents"]
