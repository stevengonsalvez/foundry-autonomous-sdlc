[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdlc-agents"
version = "0.2.0"
description = "Orchestrator, adapters and prompt agent definitions for the autonomous SDLC demo on Azure AI Foundry"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.8.0,<3",
    "azure-identity>=1.25,<2",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=6.0,<8",
    "ruff>=0.14,<1",
]
hosted = [
    "azure-ai-agentserver-core==2.1.0",
    "azure-ai-agentserver-invocations==1.1.0",
]

# uv installs the dev group by default, so `uv run pytest` works straight after a clone.
[dependency-groups]
dev = ["sdlc-agents[dev,hosted]"]

[tool.hatch.build.targets.wheel]
packages = ["sdlc_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sdlc_agents"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "RET", "PIE"]
ignore = [
    "S101",    # assert is the pytest idiom
    "S310",    # urllib with a fixed https scheme is the point of the adapters
]

[tool.ruff.lint.per-file-ignores]
# Compound asserts and tuple-style parametrize names read better in behavioural tests; path tests
# use Unicode look-alike characters on purpose.
"tests/**" = ["S105", "S106", "S108", "S311", "PT006", "PT018", "RUF001"]
