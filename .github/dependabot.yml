# Dependabot configuration
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Reviewers come from CODEOWNERS,
# which GitHub applies to Dependabot PRs, so no reviewers are listed here.
# Each ecosystem groups its minor and patch bumps into one weekly PR; majors
# still arrive individually so breaking changes get their own review.

version: 2
updates:
  # GitHub Actions: repository workflows under .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions: workflows shipped inside the sandbox template repository
  - package-ecosystem: "github-actions"
    directory: "/reference/actions-sandbox"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 5
    groups:
      sandbox-github-actions:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Python: agents and sandbox. Both projects are locked with uv, so the uv
  # ecosystem is used: the pip ecosystem would bump pyproject.toml without
  # regenerating uv.lock, and CI runs uv with --locked.
  - package-ecosystem: "uv"
    directories:
      - "/agents"
      - "/reference/actions-sandbox"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 5
    groups:
      python:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Terraform: root configuration, bootstrap and every module
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform"
      - "/infra/terraform/bootstrap"
      - "/infra/terraform/modules/*"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 5
    groups:
      terraform:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore"
      include: "scope"
