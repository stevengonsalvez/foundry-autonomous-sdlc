name: UI Proof

# Publishes UI screenshots captured by CI for pull requests to the orphan branch
# `pr-screenshots` and comments on the PR with embedded preview images.
#
# Runs from main (trusted code) via workflow_run of CI with write permissions.
# Never checks out PR code; never runs PR scripts; treats the artifact as untrusted data.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: ui-proof-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  publish:
    name: publish
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-screenshots
          path: untrusted-screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub CLI for git authentication
        run: gh auth setup-git

      - name: Validate and publish screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: >-
          python -m scripts.ui.publish_proof
          --artifacts-dir untrusted-screenshots
          --head-sha "$HEAD_SHA"
          --repo "$GITHUB_REPOSITORY"
