name: App Evolution History

# Trusted workflow from main that captures the app UI, appends screenshots to the
# pr-screenshots branch under releases/<tag-or-sha8>/, and regenerates the static /history/ page.
#
# Runs on push to main affecting app/**, release tag pushes, or after CD workflow run success.
# Never checks out untrusted PR code; treats all captured artifacts as untrusted data.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
    tags:
      - "v*"
  workflow_run:
    workflows: [CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or commit SHA to capture (defaults to main HEAD)"
        type: string
        default: ""

concurrency:
  group: pr-screenshots-writer
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  capture:
    name: capture
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies and build app
        run: |
          cd app
          npm ci
          npm run build:pages
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          node scripts/ui/capture.mjs --dist app/web/dist-pages --out-dir ui-screenshots

      - name: Upload captured screenshots artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-history-screenshots
          path: ui-screenshots
          retention-days: 1

  publish:
    name: publish
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download captured screenshots artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: app-history-screenshots
          path: downloaded-screenshots

      - name: Configure git authentication
        run: gh auth setup-git

      - name: Validate and publish screenshots to pr-screenshots
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m scripts.ui.update_history \
            --artifacts-dir downloaded-screenshots \
            --repo "$GITHUB_REPOSITORY" \
            --push
