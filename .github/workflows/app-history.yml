name: App Evolution History

# Trusted workflow from main that captures the app UI and appends screenshots
# to the pr-screenshots branch under releases/<key>/.
#
# Runs on release tag pushes or after CD workflow run success.
# Never checks out untrusted PR code; treats all captured artifacts as untrusted data.

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or commit SHA to capture (defaults to main HEAD)"
        type: string
        default: ""

concurrency:
  group: app-history
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  capture:
    name: capture
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      key: ${{ steps.resolve-key.outputs.key }}
    steps:
      - name: Resolve target ref
        id: target
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "ref=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate ref and resolve release key
        id: resolve-key
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          key=""

          if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            key="$tag"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_REF" ]; then
            if [[ "$INPUT_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              key="$INPUT_REF"
            elif [[ "$INPUT_REF" =~ ^[0-9a-f]{8}$ ]]; then
              key="$INPUT_REF"
            else
              key="$(git rev-parse --short=8 HEAD)"
            fi
          else
            echo "Commit $(git rev-parse --short=8 HEAD) is not an exact v* release tag; skipping."
            exit 0
          fi

          if [[ ! "$key" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && ! "$key" =~ ^[0-9a-f]{8}$ ]]; then
            echo "::error::Invalid key resolved: $key"
            exit 1
          fi

          echo "Resolved release key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.resolve-key.outputs.key != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies and build app
        if: steps.resolve-key.outputs.key != ''
        run: |
          cd app
          npm ci
          npm run build:pages
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        if: steps.resolve-key.outputs.key != ''
        run: |
          node scripts/ui/capture.mjs --dist app/web/dist-pages --out-dir ui-screenshots

      - name: Upload captured screenshots artifact
        if: steps.resolve-key.outputs.key != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-history-screenshots
          path: ui-screenshots
          retention-days: 1

  publish:
    name: publish
    needs: capture
    if: needs.capture.outputs.key != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download captured screenshots artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-history-screenshots
          path: downloaded-screenshots

      - name: Configure git authentication
        run: gh auth setup-git

      - name: Validate and publish screenshots to pr-screenshots
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.ui.update_history \
            --artifacts-dir downloaded-screenshots \
            --repo "$GITHUB_REPOSITORY" \
            --key "${{ needs.capture.outputs.key }}" \
            --push
