name: Pages

# The only workflow that deploys GitHub Pages. It renders the desired state of the whole site,
# because Pages serves one artifact for every path:
#
#   /                the app in `prod/` on the `deploy` branch (written by cd.yml); while that
#                    branch has no prod build yet, the app built from main
#   /staging/        the app in `staging/` on the `deploy` branch, when there is one
#   /dashboard/      the metrics dashboard from main, with metrics.json from the `metrics` branch
#   /control-center/ apps/control-center from main, when it exists
#
# cd.yml dispatches this after every change to the deploy branch; the orchestrator dispatches it
# after writing metrics.json; a push to main and the schedule are the fallbacks. Every run renders
# the current state of those branches, so two runs in a row can never publish a mixed site.
# No secrets and no Azure credentials, ever.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"

# Deployments are queued, never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # The metrics branch does not exist until the orchestrator first writes to it.
      - name: Look for the metrics branch
        id: metrics
        run: |
          rc=0
          git ls-remote --exit-code --heads \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/metrics >/dev/null || rc=$?
          case "$rc" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed with exit code $rc"; exit "$rc" ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.metrics.outputs.exists == 'true'
        with:
          ref: metrics
          path: metrics-checkout
          persist-credentials: false

      # The deploy branch does not exist until cd.yml first stages a build.
      - name: Look for the deploy branch
        id: deploy
        run: |
          rc=0
          git ls-remote --exit-code --heads \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/deploy >/dev/null || rc=$?
          case "$rc" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed with exit code $rc"; exit "$rc" ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.deploy.outputs.exists == 'true'
        with:
          ref: deploy
          path: deploy-checkout
          persist-credentials: false

      # The pr-screenshots branch holds UI evolution screenshots under releases/
      - name: Look for the pr-screenshots branch
        id: pr_screenshots
        run: |
          rc=0
          git ls-remote --exit-code --heads \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/pr-screenshots >/dev/null || rc=$?
          case "$rc" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed with exit code $rc"; exit "$rc" ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr_screenshots.outputs.exists == 'true'
        with:
          ref: pr-screenshots
          path: pr-screenshots-checkout
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Assemble the site
        env:
          METRICS_EXISTS: ${{ steps.metrics.outputs.exists }}
          DEPLOY_EXISTS: ${{ steps.deploy.outputs.exists }}
          PR_SCREENSHOTS_EXISTS: ${{ steps.pr_screenshots.outputs.exists }}
        run: |
          metrics_dir=()
          if [[ "$METRICS_EXISTS" == "true" ]]; then
            metrics_dir=(metrics-checkout)
          fi
          # Prod and staging come from the deploy branch when it holds them. Without a prod
          # build the script builds the app from main for the root, as it always did.
          if [[ "$DEPLOY_EXISTS" == "true" ]]; then
            if [[ -f deploy-checkout/prod/index.html ]]; then
              export PROD_DIST="$PWD/deploy-checkout/prod"
            fi
            if [[ -f deploy-checkout/staging/index.html ]]; then
              export STAGING_DIST="$PWD/deploy-checkout/staging"
            fi
          fi
          if [[ -f apps/control-center/index.html ]]; then
            export CONTROL_CENTER_SRC="$PWD/apps/control-center"
          fi
          if [[ "$PR_SCREENSHOTS_EXISTS" == "true" ]]; then
            export PR_SCREENSHOTS_DIR="$PWD/pr-screenshots-checkout"
          fi
          scripts/build_pages.sh _site "${metrics_dir[@]}"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
