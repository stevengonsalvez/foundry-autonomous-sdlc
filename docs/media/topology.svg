<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  
    <style>
      text {
        font-family: ui-monospace, "SF Mono", Monaco, Menlo, Consolas, "Liberation Mono", monospace;
        user-select: none;
      }
      .mono-xs { font-size: 8.5px; font-weight: 500; }
      .mono-sm { font-size: 10px; font-weight: 500; }
      .mono-md { font-size: 11.5px; font-weight: 600; }
      .mono-lg { font-size: 13px; font-weight: 700; }
      .mono-title { font-size: 13.5px; font-weight: 700; letter-spacing: 0.05em; }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
        animate, animateMotion, animateTransform {
          display: none !important;
        }
      }
    </style>
    
  <defs>
    <filter id="glow-run" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#101a21" stroke-width="0.5" />
    </pattern>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#87949f" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="560" fill="#02080f" />
  <rect width="960" height="560" fill="url(#grid)" opacity="0.6" />

  <!-- Outer Frame -->
  <rect x="12" y="12" width="936" height="536" rx="6" fill="none" stroke="#202d37" stroke-width="1" />

  <!-- Header Bar -->
  <rect x="12" y="12" width="936" height="42" fill="#040f17" rx="6" />
  <line x1="12" y1="54" x2="948" y2="54" stroke="#202d37" stroke-width="1" />
  
  <circle cx="32" cy="33" r="5" fill="#25df75" filter="url(#glow-run)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="46" y="37" fill="#dfe9f1" class="mono-title">SYSTEM TOPOLOGY // AUTONOMOUS SDLC</text>
  
  <!-- Header Telemetry Chips -->
  <rect x="520" y="24" width="96" height="18" rx="3" fill="#0f1f2a" stroke="#e8a838" stroke-width="0.8" />
  <text x="528" y="36" fill="#e8a838" class="mono-xs">POLL: */5 MIN</text>

  <rect x="626" y="24" width="106" height="18" rx="3" fill="#0f1f2a" stroke="#00c1eb" stroke-width="0.8" />
  <text x="634" y="36" fill="#00c1eb" class="mono-xs">BRANCH: state</text>

  <rect x="742" y="24" width="96" height="18" rx="3" fill="#0f1f2a" stroke="#25df75" stroke-width="0.8" />
  <text x="752" y="36" fill="#25df75" class="mono-xs">FLEET: 10 AGTS</text>

  <rect x="848" y="24" width="90" height="18" rx="3" fill="#0f1f2a" stroke="#41d2b3" stroke-width="0.8" />
  <text x="858" y="36" fill="#41d2b3" class="mono-xs">LIVE EDGES</text>

  <!-- ==================== SYSTEM NODES ==================== -->

  <!-- NODE 1: Routine Timer (Cron) -->
  <g id="node-routine">
    <rect x="360" y="68" width="240" height="54" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="360" y="68" width="240" height="2" fill="#e8a838" />
    <text x="374" y="88" fill="#dfe9f1" class="mono-md">ROUTINE TIMER</text>
    <rect x="528" y="75" width="62" height="16" rx="2" fill="#0f1f2a" stroke="#e8a838" stroke-width="0.8" />
    <text x="535" y="87" fill="#e8a838" class="mono-xs">CRON */5m</text>
    <text x="374" y="108" fill="#87949f" class="mono-xs">Azure schedule wakes orchestrator</text>
  </g>

  <!-- NODE 2: GitHub Repository -->
  <g id="node-github">
    <rect x="36" y="156" width="220" height="110" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="36" y="156" width="220" height="2" fill="#00c1eb" />
    <text x="50" y="178" fill="#dfe9f1" class="mono-md">GITHUB REPOSITORY</text>
    <rect x="180" y="165" width="66" height="16" rx="2" fill="#0f1f2a" stroke="#00c1eb" stroke-width="0.8" />
    <text x="188" y="177" fill="#00c1eb" class="mono-xs">HUB (PAT)</text>
    <text x="50" y="198" fill="#b0bdc6" class="mono-sm">Issues (owner-only intake)</text>
    <text x="50" y="216" fill="#b0bdc6" class="mono-sm">Pull requests (coder branches)</text>
    <text x="50" y="234" fill="#87949f" class="mono-xs">Labels, status checks, releases</text>
    <text x="50" y="250" fill="#87949f" class="mono-xs">Ruleset: main-gates (no bypass)</text>
  </g>

  <!-- NODE 3: sdlc-orchestrator (The Brain) -->
  <g id="node-orchestrator">
    <rect x="340" y="156" width="280" height="110" rx="4" fill="#07151f" stroke="#25df75" stroke-width="1.2" />
    <rect x="340" y="156" width="280" height="2" fill="#25df75" />
    <circle cx="356" cy="176" r="4" fill="#25df75" filter="url(#glow-run)" />
    <text x="368" y="180" fill="#dfe9f1" class="mono-md">SDLC-ORCHESTRATOR</text>
    <rect x="548" y="165" width="62" height="16" rx="2" fill="#0f1f2a" stroke="#25df75" stroke-width="0.8" />
    <text x="556" y="177" fill="#25df75" class="mono-xs">HOSTED</text>
    <text x="354" y="200" fill="#b0bdc6" class="mono-sm">Deterministic state machine</text>
    <text x="354" y="218" fill="#b0bdc6" class="mono-sm">Owns all merges . Enforces $3/$25 cap</text>
    <text x="354" y="236" fill="#87949f" class="mono-xs">PAT from Key Vault . Invocations protocol</text>
    <text x="354" y="250" fill="#87949f" class="mono-xs">Lock holder: tick state lease</text>
  </g>

  <!-- NODE 4: Prompt Agents Cluster -->
  <g id="node-prompt-agents">
    <rect x="700" y="130" width="224" height="144" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="700" y="130" width="224" height="2" fill="#b99cff" />
    <text x="714" y="152" fill="#dfe9f1" class="mono-md">PROMPT AGENTS</text>
    <rect x="826" y="139" width="88" height="16" rx="2" fill="#0f1f2a" stroke="#b99cff" stroke-width="0.8" />
    <text x="832" y="151" fill="#b99cff" class="mono-xs">SPECIALIZED</text>
    
    <text x="714" y="172" fill="#b0bdc6" class="mono-xs">req-gate (score 0..100)</text>
    <text x="714" y="188" fill="#b0bdc6" class="mono-xs">sdlc-product-owner (SIM)</text>
    <text x="714" y="204" fill="#b0bdc6" class="mono-xs">sdlc-feasibility (GitHub MCP)</text>
    <text x="714" y="220" fill="#b0bdc6" class="mono-xs">sdlc-test-designer (TDD)</text>
    <text x="714" y="236" fill="#b0bdc6" class="mono-xs">sdlc-reviewer (independent)</text>
    <text x="714" y="252" fill="#87949f" class="mono-xs">triage . ci-triage . release-notes</text>
    <text x="714" y="266" fill="#87949f" class="mono-xs">Responses API . JSON schema recheck</text>
  </g>

  <!-- NODE 5: CI Gates -->
  <g id="node-ci-gates">
    <rect x="36" y="306" width="220" height="106" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="36" y="306" width="220" height="2" fill="#ff4979" />
    <text x="50" y="326" fill="#dfe9f1" class="mono-md">CI GATES (main-gates)</text>
    <rect x="186" y="315" width="60" height="16" rx="2" fill="#0f1f2a" stroke="#ff4979" stroke-width="0.8" />
    <text x="194" y="327" fill="#ff4979" class="mono-xs">HARD GATE</text>
    <text x="50" y="346" fill="#b0bdc6" class="mono-xs">1. test (vitest, contracts)</text>
    <text x="50" y="362" fill="#b0bdc6" class="mono-xs">2. coverage (line &gt;= 80%)</text>
    <text x="50" y="378" fill="#b0bdc6" class="mono-xs">3. e2e (Playwright tests)</text>
    <text x="50" y="394" fill="#87949f" class="mono-xs">4. gitleaks  5. tdd-order  6. agent-scope</text>
    <text x="50" y="406" fill="#87949f" class="mono-xs">Plain CI: never drives an agent</text>
  </g>

  <!-- NODE 6: sdlc-coder -->
  <g id="node-coder">
    <rect x="340" y="306" width="280" height="106" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="340" y="306" width="280" height="2" fill="#b99cff" />
    <text x="354" y="326" fill="#dfe9f1" class="mono-md">SDLC-CODER (SANDBOX)</text>
    <rect x="548" y="315" width="62" height="16" rx="2" fill="#0f1f2a" stroke="#b99cff" stroke-width="0.8" />
    <text x="556" y="327" fill="#b99cff" class="mono-xs">HOSTED</text>
    <text x="354" y="346" fill="#b0bdc6" class="mono-sm">git, node, agy CLI, tests</text>
    <text x="354" y="364" fill="#b0bdc6" class="mono-sm">Commits tests first (red assertion)</text>
    <text x="354" y="382" fill="#b0bdc6" class="mono-sm">Iterates code until green; opens PR</text>
    <text x="354" y="400" fill="#87949f" class="mono-xs">Touches app/ only . 2h deadline cap</text>
  </g>

  <!-- NODE 7: sdlc-ledger -->
  <g id="node-ledger">
    <rect x="700" y="306" width="224" height="66" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="700" y="306" width="224" height="2" fill="#00c1eb" />
    <text x="714" y="326" fill="#dfe9f1" class="mono-md">SDLC-LEDGER</text>
    <rect x="834" y="315" width="80" height="16" rx="2" fill="#0f1f2a" stroke="#00c1eb" stroke-width="0.8" />
    <text x="842" y="327" fill="#00c1eb" class="mono-xs">AUTO-SCALE</text>
    <text x="714" y="344" fill="#b0bdc6" class="mono-sm">Folds events, reconciles state</text>
    <text x="714" y="360" fill="#87949f" class="mono-xs">Writes one commit per tick</text>
  </g>

  <!-- NODE 8: Continuous Deployment (CD) -->
  <g id="node-cd">
    <rect x="36" y="442" width="584" height="74" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="36" y="442" width="584" height="2" fill="#41d2b3" />
    <text x="50" y="462" fill="#dfe9f1" class="mono-md">CONTINUOUS DEPLOYMENT (cd.yml on merge)</text>
    <rect x="520" y="449" width="90" height="16" rx="2" fill="#0f1f2a" stroke="#41d2b3" stroke-width="0.8" />
    <text x="532" y="461" fill="#41d2b3" class="mono-xs">ZERO HUMAN</text>
    
    <rect x="50" y="476" width="60" height="26" rx="3" fill="#0f1f2a" stroke="#202d37" />
    <text x="66" y="493" fill="#b0bdc6" class="mono-xs">PLAN</text>

    <text x="117" y="492" fill="#87949f">→</text>

    <rect x="130" y="476" width="60" height="26" rx="3" fill="#0f1f2a" stroke="#202d37" />
    <text x="144" y="493" fill="#b0bdc6" class="mono-xs">BUILD</text>

    <text x="197" y="492" fill="#87949f">→</text>

    <rect x="210" y="476" width="76" height="26" rx="3" fill="#0f1f2a" stroke="#00c1eb" stroke-width="0.8" />
    <text x="220" y="493" fill="#00c1eb" class="mono-xs">/staging/</text>

    <text x="293" y="492" fill="#87949f">→</text>

    <rect x="306" y="476" width="86" height="26" rx="3" fill="#0f1f2a" stroke="#e8a838" stroke-width="0.8" />
    <text x="314" y="493" fill="#e8a838" class="mono-xs">SMOKE (E2E)</text>

    <text x="399" y="492" fill="#87949f">→</text>

    <rect x="412" y="476" width="80" height="26" rx="3" fill="#0f1f2a" stroke="#e8a838" stroke-width="0.8" />
    <text x="420" y="493" fill="#e8a838" class="mono-xs">SOAK (10m)</text>

    <text x="499" y="492" fill="#87949f">→</text>

    <rect x="512" y="476" width="98" height="26" rx="3" fill="#0f1f2a" stroke="#41d2b3" stroke-width="0.8" />
    <text x="522" y="493" fill="#41d2b3" class="mono-xs">PROD (SITE)</text>
  </g>

  <!-- NODE 9: Branch State -->
  <g id="node-branch-state">
    <rect x="700" y="394" width="224" height="54" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="700" y="394" width="224" height="2" fill="#25df75" />
    <text x="714" y="414" fill="#dfe9f1" class="mono-md">BRANCH `state`</text>
    <rect x="834" y="401" width="80" height="16" rx="2" fill="#0f1f2a" stroke="#25df75" stroke-width="0.8" />
    <text x="844" y="413" fill="#25df75" class="mono-xs">COMMITTED</text>
    <text x="714" y="434" fill="#87949f" class="mono-xs">state.json . events.jsonl (229 events)</text>
  </g>

  <!-- NODE 10: Control Center -->
  <g id="node-control-center">
    <rect x="700" y="468" width="224" height="48" rx="4" fill="#07151f" stroke="#202d37" stroke-width="1" />
    <rect x="700" y="468" width="224" height="2" fill="#00c1eb" />
    <text x="714" y="488" fill="#dfe9f1" class="mono-md">/control-center/</text>
    <rect x="834" y="474" width="80" height="16" rx="2" fill="#0f1f2a" stroke="#00c1eb" stroke-width="0.8" />
    <text x="846" y="486" fill="#00c1eb" class="mono-xs">8 VIEWS</text>
    <text x="714" y="504" fill="#87949f" class="mono-xs">Live matrix, swimlanes, cost telemetry</text>
  </g>

  <!-- ==================== EDGES & MOVING DOTS ==================== -->

  <!-- Path 1: Routine Timer -> Orchestrator (cron trigger) -->
  <path id="path-routine-orch" d="M 480 122 L 480 156" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="480" cy="122" r="3.5" fill="#e8a838">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 0 0 L 0 34" />
  </circle>

  <!-- Path 2: GitHub <-> Orchestrator (Intake & Sync) -->
  <path id="path-gh-orch" d="M 256 195 L 340 195" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="256" cy="195" r="3.5" fill="#00c1eb">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 0 0 L 84 0" />
  </circle>

  <!-- Path 3: Orchestrator <-> Prompt Agents (Responses API) -->
  <path id="path-orch-agents" d="M 620 195 L 700 195" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="620" cy="195" r="3.5" fill="#b99cff">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 0 0 L 80 0" />
  </circle>
  <circle cx="700" cy="205" r="3.5" fill="#25df75">
    <animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M 0 0 L -80 0" />
  </circle>

  <!-- Path 4: Orchestrator -> Coder (Task Invocations) -->
  <path id="path-orch-coder" d="M 480 266 L 480 306" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="480" cy="266" r="3.5" fill="#b99cff">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 0 0 L 0 40" />
  </circle>

  <!-- Path 5: Coder -> GitHub (Push branch & Open PR) -->
  <path id="path-coder-gh" d="M 340 330 L 290 330 L 290 230 L 256 230" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" fill="none" />
  <circle cx="340" cy="330" r="3.5" fill="#00c1eb">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 0 0 L -50 0 L -50 -100 L -84 -100" />
  </circle>

  <!-- Path 6: GitHub -> CI Gates (Trigger Required Checks) -->
  <path id="path-gh-ci" d="M 146 266 L 146 306" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="146" cy="266" r="3.5" fill="#ff4979">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 0 0 L 0 40" />
  </circle>

  <!-- Path 7: CI Gates -> Orchestrator (Check Results Green) -->
  <path id="path-ci-orch" d="M 256 360 L 300 360 L 300 250 L 340 250" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" fill="none" />
  <circle cx="256" cy="360" r="3.5" fill="#25df75">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 0 0 L 44 0 L 44 -110 L 84 -110" />
  </circle>

  <!-- Path 8: Orchestrator -> GitHub Merge & CD Trigger -->
  <path id="path-orch-merge" d="M 340 215 L 256 215" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="340" cy="215" r="3.5" fill="#25df75">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 0 0 L -84 0" />
  </circle>

  <path id="path-gh-cd" d="M 110 266 L 110 442" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="110" cy="266" r="3.5" fill="#41d2b3">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 0 0 L 0 176" />
  </circle>

  <!-- Path 9: CD Staging -> Prod flow -->
  <path id="path-cd-flow" d="M 110 489 L 512 489" stroke="#202d37" stroke-width="1" stroke-dasharray="2,2" />
  <circle cx="110" cy="489" r="3.5" fill="#41d2b3">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 0 0 L 402 0" />
  </circle>

  <!-- Path 10: Orchestrator -> Ledger (Telemetry Events) -->
  <path id="path-orch-ledger" d="M 620 240 L 660 240 L 660 330 L 700 330" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" fill="none" />
  <circle cx="620" cy="240" r="3.5" fill="#00c1eb">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 0 0 L 40 0 L 40 90 L 80 90" />
  </circle>

  <!-- Path 11: Ledger -> Branch State (Single Commit per Tick) -->
  <path id="path-ledger-state" d="M 812 372 L 812 394" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="812" cy="372" r="3.5" fill="#25df75">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 0 0 L 0 22" />
  </circle>

  <!-- Path 12: Branch State -> Control Center (Telemetry Poll) -->
  <path id="path-state-cc" d="M 812 448 L 812 468" stroke="#202d37" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="812" cy="448" r="3.5" fill="#00c1eb">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 0 0 L 0 20" />
  </circle>

  <!-- ==================== FOOTER STATUS ==================== -->
  <rect x="12" y="524" width="936" height="24" fill="#040f17" rx="3" />
  <text x="24" y="540" fill="#87949f" class="mono-xs">TIMINGS COMPRESSED (12m-45m WALL CLOCK) . REAL RECORDED TRACES (BRANCH ORIGIN/STATE) . ZERO SCRIPTS . PURE VECTOR SVG</text>
</svg>
