  <line x1="445" y1="136" x2="445" y2="276" stroke="#101a21" stroke-dasharray="2,2" />
  <line x1="549" y1="136" x2="549" y2="276" stroke="#101a21" stroke-dasharray="2,2" />
  <line x1="659" y1="136" x2="659" y2="276" stroke="#101a21" stroke-dasharray="2,2" />
  <line x1="791" y1="136" x2="791" y2="276" stroke="#101a21" stroke-dasharray="2,2" />

