  <rect x="36" y="290" width="4" height="110" fill="#00c1eb" />

  <text x="50" y="310" fill="#dfe9f1" class="mono-md">CHRONOLOGICAL AUDIT TRAIL // ISSUE #24</text>
  <text x="340" y="310" fill="#87949f" class="mono-xs">TITLE: "Make the parcel tracker better" (scenario b)</text>

  <text x="50" y="332" fill="#b0bdc6" class="mono-xs">00:00  [req-gate] Bounced: score 72 &lt; 80 threshold. Asked 2 clarification questions.</text>
  <text x="50" y="348" fill="#e8a838" class="mono-xs">00:03  [product-owner] Simulated PO replied with concrete criteria. Re-score: 90/100 (ready).</text>
  <text x="50" y="364" fill="#b0bdc6" class="mono-xs">00:05  [feasibility] Suitable: True, risk low. Scoped to parcel tracker view.</text>
  <text x="50" y="380" fill="#b99cff" class="mono-xs">00:07  [sdlc-coder] Commit c0f5713 (tests first, 1 failed, 0 loaded) -> Commit fcc6f1e (5 files fixed, green).</text>
