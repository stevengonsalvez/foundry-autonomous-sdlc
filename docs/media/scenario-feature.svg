  <line x1="12" y1="54" x2="948" y2="54" stroke="#202d37" stroke-width="1" />
  
  <circle cx="32" cy="33" r="5" fill="#25df75" filter="url(#glow-feat)" />
  <text x="46" y="37" fill="#dfe9f1" class="mono-title">SCENARIO 1 // FEATURE HAPPY PATH (ISSUE #24)</text>
  
