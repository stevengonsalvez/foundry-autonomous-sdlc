<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" role="img" aria-label="LIVE PROOF // real GitHub, real agy, real merges">
<title>LIVE PROOF // real GitHub, real agy, real merges</title>
<style>
  text { font-family: ui-monospace, "SF Mono", Monaco, Menlo, Consolas, "Liberation Mono", monospace; user-select: none; }
  .xs { font-size: 8.5px; font-weight: 500; } .sm { font-size: 10px; font-weight: 500; }
  .md { font-size: 11.5px; font-weight: 600; } .lg { font-size: 13px; font-weight: 700; }
  .ttl { font-size: 13.5px; font-weight: 700; letter-spacing: 0.05em; }
  .flow { stroke-dasharray: 5 5; animation: dash 1.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } animate { display: none !important; } }
</style>
<defs>
