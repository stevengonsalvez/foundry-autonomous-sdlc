    <animateMotion dur="14s" repeatCount="indefinite" path="M 0 0 L 100 0 L 205 0 L 310 0 L 420 0 Q 480 0 500 40 Q 440 55 310 55" keyTimes="0;0.15;0.30;0.45;0.60;0.75;1" />
