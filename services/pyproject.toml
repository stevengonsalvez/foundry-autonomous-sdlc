[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdlc-factory"
version = "0.1.0"
description = "Temporal workflows, CLI agent engines and ledger services for the autonomous SDLC factory"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.34,<2",
    "pyyaml>=6,<7",
    "pymysql>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "jsonschema>=4.23,<5",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["sdlc_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["../agents", "../agents/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "RET", "PIE"]
ignore = ["S101", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "PT006", "PT018", "RUF001"]
